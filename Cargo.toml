[package]
name = "qhandshake"
version = "0.1.0"
edition = "2024"
description = "Research prototype: TLS 1.3-modelled hybrid X25519 + ML-KEM-768 authenticated handshake. NOT for protecting real data."
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
chacha20poly1305 = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hkdf = "0.13.0"
hmac = "0.13.0"
ml-kem = { version = "0.3.4", features = ["getrandom", "zeroize"] }
rand_core = "0.10.1"
sha2 = "0.11.1"
thiserror = "2.0.21"
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
zeroize = { version = "1.9.2", features = ["zeroize_derive"] }

[dev-dependencies]
proptest = "1.12.0"

[profile.release]
debug = 1
