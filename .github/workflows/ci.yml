name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: python3 tools/kat.py
      - run: bash examples/demo.sh

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz run server_input --fuzz-dir fuzz -- -max_total_time=120 -max_len=4096

  proverif:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ocaml-nox ocamlbuild ocaml-findlib
      - name: build ProVerif 2.05 (command-line only, checksum from opam metadata)
        run: |
          curl -fsSL -o pv.tar.gz https://proverif.inria.fr/proverif2.05.tar.gz
          echo "4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4  pv.tar.gz" | sha256sum -c
          mkdir pv && tar xzf pv.tar.gz -C pv --strip-components=1 && cd pv && ./build -nointeract
      - run: PROVERIF=$PWD/pv/proverif bash formal/run.sh
